server:
    interface: 127.0.0.1
    port: 5335

    do-ip4: yes
    do-ip6: no

    access-control: 127.0.0.0/8 allow

    username: ""
    chroot: ""

    hide-identity: yes
    hide-version: yes

    harden-dnssec-stripped: yes
    val-permissive-mode: no
    qname-minimisation: yes

    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    local-zone: "unsigned.test." static
    local-data: "unsigned.test. 60 IN A 192.0.2.44"

    verbosity: 4
    val-log-level: 2
    log-servfail: yes